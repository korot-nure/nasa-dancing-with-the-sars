<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <filter id="speckle">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="11" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="800" height="600" fill="#4b5563" />
  <rect width="800" height="600" filter="url(#speckle)" opacity="0.45" />
  <g stroke="#9ca3af" stroke-width="1" opacity="0.2">
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>
</svg>
